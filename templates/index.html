<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
            height: 100vh;
            position: relative;
        }

        /* Chat Baloncuğu */
        .chat-bubble {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #007AFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .chat-bubble:hover {
            transform: scale(1.1);
        }

        .chat-bubble-icon {
            color: white;
            font-size: 24px;
        }

        /* Yardım Balonu */
        .help-tooltip {
            position: fixed;
            bottom: 90px;
            right: 20px;
            background: white;
            padding: 12px 20px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            color: #333;
            display: none;
            animation: fadeIn 0.3s ease;
            z-index: 999;
        }

        .help-tooltip.show {
            display: block;
        }

        .help-tooltip:after {
            content: '';
            position: absolute;
            bottom: -8px;
            right: 24px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid white;
        }

        /* Chat Container */
        .chat-container {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 380px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .chat-container.show {
            display: flex;
        }

        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            background: #fff;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 1.2rem;
            color: #1a1a1a;
            font-weight: 600;
        }

        .close-button {
            background: none;
            border: none;
            color: #666;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 8px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 70%;
            padding: 1rem;
            border-radius: 12px;
            margin: 0.5rem 0;
            animation: fadeIn 0.3s ease-in-out;
        }

        .user-message {
            background: #007AFF;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background: #F2F2F7;
            color: #1a1a1a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-input-container {
            padding: 1.5rem;
            border-top: 1px solid #eee;
            background: #fff;
            border-radius: 0 0 12px 12px;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 1rem;
        }

        .chat-input {
            flex: 1;
            padding: 1rem;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            outline: none;
            resize: none;
            max-height: 100px;
            min-height: 44px;
        }

        .chat-input:focus {
            border-color: #007AFF;
        }

        .send-button {
            padding: 0.8rem 1.5rem;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            white-space: nowrap;
        }

        .send-button:hover {
            background: #0056b3;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #F2F2F7;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            margin: 0.5rem 0;
            color: #666;
            font-size: 0.9rem;
        }

        .typing-indicator.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .chat-container {
                width: 100%;
                height: 100%;
                bottom: 0;
                right: 0;
                border-radius: 0;
            }

            .chat-header {
                border-radius: 0;
            }

            .message {
                max-width: 85%;
            }

            .chat-bubble {
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Yardım Balonu -->
    <div class="help-tooltip" id="helpTooltip">
        Yardıma ihtiyacınız var mı? 🤔
    </div>

    <!-- Chat Baloncuğu -->
    <div class="chat-bubble" id="chatBubble">
        <div class="chat-bubble-icon">💬</div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            <h1>Akıllı Asistan</h1>
            <button class="close-button" id="closeChat">&times;</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                Merhaba! Size nasıl yardımcı olabilirim?
            </div>
        </div>
        <div class="typing-indicator" id="typingIndicator">
            Asistan yazıyor...
        </div>
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="Mesajınızı yazın..."
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = null;
        const chatBubble = document.getElementById('chatBubble');
        const helpTooltip = document.getElementById('helpTooltip');
        const chatContainer = document.getElementById('chatContainer');
        const closeChat = document.getElementById('closeChat');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');

        // Yardım balonunu göster
        setTimeout(() => {
            helpTooltip.classList.add('show');
        }, 2000);

        // Chat baloncuğuna tıklandığında
        chatBubble.addEventListener('click', () => {
            chatContainer.classList.add('show');
            helpTooltip.classList.remove('show');
            if (!sessionId) {
                initializeSession();
            }
        });

        // Kapatma butonuna tıklandığında
        closeChat.addEventListener('click', () => {
            chatContainer.classList.remove('show');
        });

        // Session ID'yi al veya yeni oturum başlat
        async function initializeSession() {
            try {
                const response = await fetch('/api/session', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                const data = await response.json();
                if (data.status === 'success') {
                    sessionId = data.session_id;
                    console.log('Session başlatıldı:', sessionId);
                }
            } catch (error) {
                console.error('Session başlatılamadı:', error);
                addMessage('Bağlantı hatası oluştu. Lütfen sayfayı yenileyin.', 'bot');
            }
        }

        // Mesaj gönderme fonksiyonu
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !sessionId) return;

            // Kullanıcı mesajını ekle
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';
            
            // Typing indicator'ı göster
            typingIndicator.classList.add('active');

            try {
                const response = await fetch(`/api/chat/${sessionId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                
                // Typing indicator'ı gizle
                typingIndicator.classList.remove('active');

                // Hata kontrolü
                if (data.error) {
                    if (data.error === "Geçersiz veya süresi dolmuş oturum") {
                        // Session'ı yenile
                        await initializeSession();
                        addMessage('Oturumunuz yenilendi. Lütfen mesajınızı tekrar gönderin.', 'bot');
                    } else {
                        addMessage(`Hata: ${data.error}`, 'bot');
                    }
                    return;
                }

                // Bot yanıtını ekle
                if (data.response) {
                    addMessage(data.response, 'bot');
                }

                // Eğer bir sonraki adım için beklenen bir giriş varsa
                if (data.expecting) {
                    handleExpectedInput(data.expecting);
                }

            } catch (error) {
                console.error('Mesaj gönderilemedi:', error);
                typingIndicator.classList.remove('active');
                addMessage('Üzgünüm, bir bağlantı hatası oluştu.', 'bot');
            }
        }

        // Beklenen giriş tipine göre UI'ı güncelle
        function handleExpectedInput(expectationType) {
            let placeholder = '';
            
            switch (expectationType) {
                case 'identifier':
                    placeholder = 'TC Kimlik No (11 haneli) veya Abone No (6 haneli)';
                    break;
                case 'subscriber_no':
                    placeholder = '6 haneli abone numaranızı girin';
                    break;
                case 'birth_date':
                    placeholder = 'Doğum tarihi (YYYY-AA-GG)';
                    break;
                case 'address':
                    placeholder = 'Açık adresinizi girin';
                    break;
                case 'city':
                    placeholder = 'Şehir adı girin';
                    break;
                case 'district':
                    placeholder = 'Mahalle adı girin';
                    break;
                case 'method_choice':
                    placeholder = '1 veya 2 yazın';
                    break;
                case 'complaint_type':
                    placeholder = 'Şikayet türü için 1-6 arası bir rakam girin';
                    break;
                case 'description':
                    placeholder = 'Sorununuzu kısaca açıklayın';
                    break;
                default:
                    placeholder = 'Mesajınızı yazın...';
            }
            
            messageInput.placeholder = placeholder;
        }

        // Mesajları UI'a ekle
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', `${sender}-message`);
            
            // Mesajdaki satır sonlarını koru
            const formattedText = text.replace(/\n/g, '<br>');
            messageDiv.innerHTML = formattedText;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Textarea yüksekliğini otomatik ayarla
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // Enter tuşu ile gönderme (Shift + Enter için yeni satır)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        // Session kontrolü ve yenileme
        setInterval(async function() {
            if (sessionId) {
                try {
                    const response = await fetch(`/api/chat/${sessionId}`, {
                        method: 'OPTIONS'
                    });
                    if (!response.ok) {
                        await initializeSession();
                    }
                } catch (error) {
                    console.error('Session kontrol hatası:', error);
                }
            }
        }, 60000); // Her dakika kontrol et
    </script>
</body>
</html>
